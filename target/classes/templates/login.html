<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hospital - Iniciar sesión</title>
</head>

<body>

<h1>Hospital</h1>

<h2>Iniciar sesión</h2>

<div th:if="${param.error}">
    Usuario o contraseña incorrectos.
</div>

<div th:if="${param.logout}">
    Sesión cerrada correctamente.
</div>
<div th:if="${mensaje}">
    <strong th:text="${mensaje}"></strong>
</div>

<form th:action="@{/login}" method="post">

    <div>
        <label for="username">
            Usuario
        </label>

        <input
                type="text"
                id="username"
                name="username"
                required>
    </div>

    <div>
        <label for="password">
            Contraseña
        </label>

        <input
                type="password"
                id="password"
                name="password"
                required>
    </div>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

<p>
    ¿No tiene una cuenta?

    <a th:href="@{/registro}">
        Registrarse como paciente
    </a>
</p>

</body>
</html>
