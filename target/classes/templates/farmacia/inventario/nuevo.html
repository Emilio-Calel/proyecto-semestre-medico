<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar Movimiento</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f9;
            color: #1f2933;
        }

        .topbar {
            background: linear-gradient(
                    135deg,
                    #0f6f7a,
                    #1596a3
            );
            color: white;
            padding: 22px 34px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 22px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #e2ebed;
            box-shadow: 0 8px 24px rgba(30,70,80,0.07);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
            color: #506067;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccd9dc;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 22px;
        }

        .info-box {
            background: #f5fafb;
            border: 1px solid #d9e6e8;
            border-radius: 10px;
            padding: 15px;
        }

        .info-box small {
            display: block;
            color: #748389;
            margin-bottom: 5px;
        }

        .info-box strong {
            font-size: 20px;
        }

        .alert {
            margin-top: 10px;
            padding: 11px;
            border-radius: 8px;
            display: none;
        }

        .alert-low {
            display: block;
            background: #fff0ef;
            color: #a33b31;
            border: 1px solid #efc4c0;
        }

        .error {
            background: #fff0ef;
            color: #a33b31;
            border: 1px solid #efc4c0;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 18px;
        }

        .hidden {
            display: none;
        }

        .help {
            margin-top: 6px;
            font-size: 12px;
            color: #748389;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            padding: 11px 17px;
            border-radius: 9px;
            border: none;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #0f6f7a;
            color: white;
        }

        .btn-secondary {
            background: #e8eef0;
            color: #405057;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

<header class="topbar">
    <h1>Registrar Movimiento</h1>
</header>

<main class="container">

    <section class="card">

        <div
                class="error"
                th:if="${error}"
                th:text="${error}">
        </div>

        <form
                th:action="@{/farmacia/inventario/guardar}"
                th:object="${movimiento}"
                method="post">

            <div class="field">

                <label for="inventarioId">
                    Medicamento / Sucursal *
                </label>

                <select
                        id="inventarioId"
                        th:field="*{inventarioId}"
                        required>

                    <option value="">
                        Seleccione...
                    </option>

                    <option
                            th:each="inv : ${inventarios}"
                            th:value="${inv.id}"
                            th:data-stock="${inv.stockActual}"
                            th:data-minimo="${inv.medicamento.stockMinimo != null
                                ? inv.medicamento.stockMinimo
                                : 0}"
                            th:text="${inv.medicamento.nombre
                                + ' - '
                                + inv.sucursal.nombre
                                + ' | Stock: '
                                + inv.stockActual}">
                    </option>

                </select>

            </div>

            <div class="grid">

                <div class="info-box">

                    <small>
                        Stock actual
                    </small>

                    <strong id="stockActual">
                        -
                    </strong>

                </div>

                <div class="info-box">

                    <small>
                        Stock proyectado
                    </small>

                    <strong id="stockProyectado">
                        -
                    </strong>

                </div>

                <div class="info-box">

                    <small>
                        Stock mínimo
                    </small>

                    <strong id="stockMinimo">
                        -
                    </strong>

                </div>

            </div>

            <div
                    id="alertaStock"
                    class="alert">
            </div>

            <div class="field">

                <label for="tipoMovimiento">
                    Tipo de movimiento *
                </label>

                <select
                        id="tipoMovimiento"
                        th:field="*{tipoMovimiento}"
                        required>

                    <option value="">
                        Seleccione...
                    </option>

                    <option
                            th:each="tipo : ${tiposMovimiento}"
                            th:value="${tipo}"
                            th:text="${tipo}">
                    </option>

                </select>

            </div>

            <div class="field">

                <label for="cantidad">
                    Cantidad *
                </label>

                <input
                        id="cantidad"
                        type="number"
                        min="1"
                        required
                        th:field="*{cantidad}">

            </div>

            <div
                    id="campoCosto"
                    class="field hidden">

                <label for="costoUnitario">
                    Costo unitario *
                </label>

                <input
                        id="costoUnitario"
                        type="number"
                        step="0.01"
                        min="0.01"
                        th:field="*{costoUnitario}">

                <div class="help">
                    Obligatorio únicamente para compras.
                </div>

            </div>

            <div class="field">

                <label for="referencia">
                    Referencia
                </label>

                <input
                        id="referencia"
                        type="text"
                        maxlength="100"
                        placeholder="Factura, documento, número interno..."
                        th:field="*{referencia}">

            </div>

            <div
                    id="campoMotivo"
                    class="field hidden">

                <label for="motivo">
                    Motivo *
                </label>

                <textarea
                        id="motivo"
                        maxlength="500"
                        th:field="*{motivo}">
                </textarea>

                <div class="help">
                    Entre 10 y 500 caracteres cuando sea obligatorio.
                </div>

            </div>

            <div class="actions">

                <a
                        class="btn btn-secondary"
                        th:href="@{/farmacia/inventario}">
                    Cancelar
                </a>

                <button
                        type="submit"
                        class="btn btn-primary">
                    Registrar movimiento
                </button>

            </div>

        </form>

    </section>

</main>

<script>

    const inventarioSelect =
        document.getElementById("inventarioId");

    const tipoSelect =
        document.getElementById("tipoMovimiento");

    const cantidadInput =
        document.getElementById("cantidad");

    const stockActualElement =
        document.getElementById("stockActual");

    const stockProyectadoElement =
        document.getElementById("stockProyectado");

    const stockMinimoElement =
        document.getElementById("stockMinimo");

    const alertaStock =
        document.getElementById("alertaStock");

    const campoCosto =
        document.getElementById("campoCosto");

    const costoInput =
        document.getElementById("costoUnitario");

    const campoMotivo =
        document.getElementById("campoMotivo");

    const motivoInput =
        document.getElementById("motivo");


    function esEntrada(tipo) {

        return tipo === "COMPRA"
            || tipo === "DEVOLUCION"
            || tipo === "AJUSTE_POSITIVO";
    }


    function requiereMotivo(tipo) {

        return tipo === "DEVOLUCION"
            || tipo === "RECLAMO"
            || tipo === "AJUSTE_POSITIVO"
            || tipo === "AJUSTE_NEGATIVO";
    }


    function actualizarCampos() {

        const tipo =
            tipoSelect.value;

        /*
         * COSTO
         */

        if (tipo === "COMPRA") {

            campoCosto.classList.remove(
                "hidden"
            );

            costoInput.required = true;

        } else {

            campoCosto.classList.add(
                "hidden"
            );

            costoInput.required = false;
        }

        /*
         * MOTIVO
         */

        if (requiereMotivo(tipo)) {

            campoMotivo.classList.remove(
                "hidden"
            );

            motivoInput.required = true;
            motivoInput.minLength = 10;

        } else {

            campoMotivo.classList.add(
                "hidden"
            );

            motivoInput.required = false;
        }

        actualizarProyeccion();
    }


    function actualizarProyeccion() {

        const opcion =
            inventarioSelect
                .options[
                inventarioSelect.selectedIndex
                ];

        if (!opcion
            || !opcion.dataset.stock) {

            stockActualElement.textContent =
                "-";

            stockProyectadoElement.textContent =
                "-";

            stockMinimoElement.textContent =
                "-";

            alertaStock.className =
                "alert";

            alertaStock.textContent =
                "";

            return;
        }

        const stockActual =
            parseInt(
                opcion.dataset.stock
            );

        const minimo =
            parseInt(
                opcion.dataset.minimo || "0"
            );

        const cantidad =
            parseInt(
                cantidadInput.value || "0"
            );

        const tipo =
            tipoSelect.value;

        let proyectado =
            stockActual;

        if (tipo && cantidad > 0) {

            if (esEntrada(tipo)) {

                proyectado =
                    stockActual
                    + cantidad;

            } else {

                proyectado =
                    stockActual
                    - cantidad;
            }
        }

        stockActualElement.textContent =
            stockActual;

        stockProyectadoElement.textContent =
            proyectado;

        stockMinimoElement.textContent =
            minimo;

        if (proyectado < 0) {

            alertaStock.className =
                "alert alert-low";

            alertaStock.textContent =
                "Stock insuficiente para realizar esta salida.";

        } else if (proyectado <= minimo) {

            alertaStock.className =
                "alert alert-low";

            alertaStock.textContent =
                "Advertencia: el inventario quedará en nivel mínimo o bajo.";

        } else {

            alertaStock.className =
                "alert";

            alertaStock.textContent =
                "";
        }
    }


    inventarioSelect.addEventListener(
        "change",
        actualizarProyeccion
    );

    tipoSelect.addEventListener(
        "change",
        actualizarCampos
    );

    cantidadInput.addEventListener(
        "input",
        actualizarProyeccion
    );


    actualizarCampos();
    actualizarProyeccion();

</script>

</body>
</html>
