<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cita registrada</title>
</head>

<body>

<h1>Cita registrada</h1>

<div th:if="${mensaje}">
    <strong th:text="${mensaje}">
    </strong>
</div>

<p>
    Número de cita:
    <strong th:text="${numeroCita}">
    </strong>
</p>

<p>
    Su horario se encuentra reservado
    temporalmente mientras completa el pago.
</p>

<p>
    <a th:href="@{/}">
        Volver
    </a>
</p>

<div th:if="${citaId}">

    <p>
        Su horario se encuentra reservado
        temporalmente mientras completa el pago.
    </p>

    <a th:href="@{/pagos/online/{id}(id=${citaId})}">
        Pagar en línea
    </a>

</div>

</body>
</html>
