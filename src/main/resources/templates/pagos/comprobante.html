<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Comprobante de pago</title>
</head>

<body>

<h1>Pago Aprobado</h1>

<p>
    Su cita ha sido confirmada correctamente.
</p>

<hr>

<h2>Comprobante</h2>

<p>
    Número de transacción:
    <strong th:text="${pago.numeroTransaccion}">
    </strong>
</p>

<p>
    Número de cita:
    <strong th:text="${cita.numeroCita}">
    </strong>
</p>

<p>
    Paciente:
    <strong th:text="${cita.paciente.nombreCompleto}">
    </strong>
</p>

<p>
    Monto:
    Q
    <strong th:text="${pago.monto}">
    </strong>
</p>

<p>
    Método:
    <strong th:text="${pago.metodoPago}">
    </strong>
</p>

<p>
    Tarjeta terminada en:
    ****
    <strong th:text="${pago.ultimos4}">
    </strong>
</p>

<p>
    Fecha de pago:
    <strong th:text="${pago.fechaPago}">
    </strong>
</p>

<p>
    Servicio:
    <strong th:text="${cita.especialidad.nombre}">
    </strong>
</p>

<p>
    Sucursal:
    <strong th:text="${cita.sucursal.nombre}">
    </strong>
</p>

<p>
    Referencia:
    <strong th:text="${pago.referenciaPasarela}">
    </strong>
</p>

<hr>

<button onclick="window.print()">
    Imprimir comprobante
</button>

<p>
    <a th:href="@{/}">
        Volver al inicio
    </a>
</p>

</body>
</html>
