<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Comprobante de Pago</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f4f8f9;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;

            color: #203438;
        }

        .container {
            width: min(720px, calc(100% - 32px));
            margin: 40px auto;
        }

        .receipt {
            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                    0 10px 30px rgba(35,73,79,.10);
        }

        .header {
            padding: 28px;

            text-align: center;

            color: white;

            background: linear-gradient(
                    135deg,
                    #0f6f7a,
                    #1596a3
            );
        }

        .header .icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 7px 0 0;
            opacity: .9;
        }

        .body {
            padding: 27px;
        }

        .row {
            padding: 12px 0;

            display: flex;
            justify-content: space-between;
            gap: 20px;

            border-bottom:
                    1px solid #edf2f3;
        }

        .row span {
            color: #71868a;
        }

        .row strong {
            text-align: right;
        }

        .total {
            margin-top: 18px;

            padding: 17px;

            border-radius: 12px;

            display: flex;
            justify-content: space-between;

            background: #e8f6f7;

            color: #0f6f7a;

            font-size: 18px;
            font-weight: 800;
        }

        .success {
            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            color: #12633e;

            background: #e9f7ef;

            text-align: center;

            font-weight: 700;
        }

        .actions {
            margin-top: 25px;

            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .button {
            padding: 10px 17px;

            border: none;
            border-radius: 9px;

            text-decoration: none;
            cursor: pointer;

            font-family: inherit;
            font-weight: 700;
        }

        .button-primary {
            color: white;
            background:
                    linear-gradient(
                            135deg,
                            #0f6f7a,
                            #1596a3
                    );
        }

        .button-secondary {
            color: #465f63;
            background: #edf3f4;
        }

        @media print {

            body {
                background: white;
            }

            .container {
                width: 100%;
                margin: 0;
            }

            .receipt {
                box-shadow: none;
            }

            .actions {
                display: none;
            }
        }

    </style>

</head>

<body>

<main class="container">

    <section class="receipt">

        <div class="header">

            <div class="icon">
                ✅
            </div>

            <h1>
                Pago aprobado
            </h1>

            <p>
                Comprobante de laboratorio
            </p>

        </div>

        <div class="body">

            <div class="row">

                <span>
                    Transacción
                </span>

                <strong th:text="${pago.numeroTransaccion}">
                </strong>

            </div>

            <div class="row">

                <span>
                    Orden
                </span>

                <strong th:text="${orden.numeroOrden}">
                </strong>

            </div>

            <div class="row">

                <span>
                    Paciente
                </span>

                <strong th:text="${orden.paciente.nombreCompleto}">
                </strong>

            </div>

            <div class="row">

                <span>
                    Método
                </span>

                <strong th:text="${pago.metodoPago}">
                </strong>

            </div>

            <div class="row"
                 th:if="${pago.ultimos4 != null}">

                <span>
                    Tarjeta
                </span>

                <strong th:text="'**** ' + ${pago.ultimos4}">
                </strong>

            </div>

            <div class="row"
                 th:if="${pago.montoRecibido != null}">

                <span>
                    Recibido
                </span>

                <strong th:text="'Q' + ${#numbers.formatDecimal(
                        pago.montoRecibido,
                        1,
                        2
                )}">
                </strong>

            </div>

            <div class="row"
                 th:if="${pago.cambio != null}">

                <span>
                    Cambio
                </span>

                <strong th:text="'Q' + ${#numbers.formatDecimal(
                        pago.cambio,
                        1,
                        2
                )}">
                </strong>

            </div>

            <div class="row">

                <span>
                    Fecha
                </span>

                <strong th:text="${#temporals.format(
                        pago.fechaPago,
                        'dd/MM/yyyy HH:mm'
                )}">
                </strong>

            </div>

            <div class="total">

                <span>
                    Total
                </span>

                <span th:text="'Q' + ${#numbers.formatDecimal(
                        pago.monto,
                        1,
                        2
                )}">
                </span>

            </div>

            <div class="success">
                La orden fue habilitada para procesamiento en laboratorio.
            </div>

            <div class="actions">

                <button type="button"
                        class="button button-secondary"
                        onclick="window.print();">
                    Imprimir
                </button>

                <a th:href="@{/caja/laboratorio}"
                   class="button button-primary">
                    Nuevo Pago
                </a>

            </div>

        </div>

    </section>

</main>

</body>
</html>
