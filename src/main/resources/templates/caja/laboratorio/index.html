<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Caja - Laboratorio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --teal-dark: #0f6f7a;
      --teal: #1596a3;
      --teal-light: #e8f6f7;
      --background: #f4f8f9;
      --white: #ffffff;
      --text: #203438;
      --muted: #71868a;
      --border: #dbe8ea;
      --success-bg: #e9f7ef;
      --danger-bg: #fff0ee;
      --warning-bg: #fff7df;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .topbar {
      min-height: 74px;
      padding: 14px 34px;
      color: white;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: linear-gradient(
              135deg,
              var(--teal-dark),
              var(--teal)
      );

      box-shadow:
              0 5px 18px rgba(15,111,122,.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      background: rgba(255,255,255,.16);
      border-radius: 13px;

      font-size: 23px;
    }

    .brand h1 {
      font-size: 20px;
    }

    .brand p {
      margin-top: 2px;
      font-size: 13px;
      opacity: .85;
    }

    .home-button {
      text-decoration: none;
      color: white;

      background: rgba(255,255,255,.14);

      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
    }

    .container {
      width: min(1150px, calc(100% - 38px));
      margin: 30px auto 60px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 7px 23px rgba(35,73,79,.06);
    }

    .search-card {
      padding: 24px;
      margin-bottom: 20px;
    }

    .search-card h2 {
      color: var(--teal-dark);
      margin-bottom: 5px;
      font-size: 22px;
    }

    .search-card p {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 13px;
    }

    .search-form {
      display: grid;
      grid-template-columns: 190px 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field label {
      display: block;
      margin-bottom: 7px;

      font-size: 12px;
      font-weight: 700;
      color: #486266;
    }

    select,
    input {
      width: 100%;
      min-height: 42px;

      border: 1px solid #ccdadd;
      border-radius: 9px;
      padding: 9px 11px;

      outline: none;
      font: inherit;
      font-size: 13px;
    }

    select:focus,
    input:focus {
      border-color: var(--teal);
      box-shadow:
              0 0 0 3px rgba(21,150,163,.10);
    }

    .button {
      min-height: 42px;

      border: none;
      border-radius: 9px;

      padding: 9px 16px;

      cursor: pointer;
      text-decoration: none;

      display: inline-flex;
      justify-content: center;
      align-items: center;

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
    }

    .button-primary {
      color: white;
      background: linear-gradient(
              135deg,
              var(--teal-dark),
              var(--teal)
      );
    }

    .button-pay {
      color: var(--teal-dark);
      background: var(--teal-light);
    }

    .alert {
      margin-bottom: 18px;
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 13px;
    }

    .alert-error {
      color: #9d3025;
      background: var(--danger-bg);
      border: 1px solid #edc8c1;
    }

    .alert-info {
      color: #765d18;
      background: var(--warning-bg);
      border: 1px solid #eddc9e;
    }

    .table-card {
      overflow: hidden;
    }

    .table-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .table-header h3 {
      color: var(--teal-dark);
      font-size: 17px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
    }

    th {
      padding: 13px 15px;

      text-align: left;

      background: #f7fafb;
      border-bottom: 1px solid var(--border);

      color: #587075;
      font-size: 11px;
      text-transform: uppercase;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #edf2f3;
      font-size: 13px;
    }

    .order {
      font-weight: 800;
      color: var(--teal-dark);
    }

    .patient {
      font-weight: 700;
    }

    .amount {
      font-weight: 800;
    }

    .empty {
      padding: 45px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .search-form {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 14px 18px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      💳
    </div>

    <div>
      <h1>Caja - Laboratorio</h1>
      <p>Cobro de órdenes de laboratorio</p>
    </div>

  </div>

  <a th:href="@{/}"
     class="home-button">
    ← Inicio
  </a>

</header>

<main class="container">

  <div th:if="${error}"
       class="alert alert-error"
       th:text="${error}">
  </div>

  <div th:if="${mensajeBusqueda}"
       class="alert alert-info"
       th:text="${mensajeBusqueda}">
  </div>

  <section class="card search-card">

    <h2>Buscar orden pendiente</h2>

    <p>
      Busque al paciente por DPI o ingrese
      directamente el número de orden.
    </p>

    <form th:action="@{/caja/laboratorio/buscar}"
          method="get"
          class="search-form">

      <div class="field">

        <label for="tipoBusqueda">
          Buscar por
        </label>

        <select id="tipoBusqueda"
                name="tipoBusqueda"
                required>

          <option value="DPI"
                  th:selected="${tipoBusqueda == 'DPI'}">
            DPI
          </option>

          <option value="ORDEN"
                  th:selected="${tipoBusqueda == 'ORDEN'}">
            Número de orden
          </option>

        </select>

      </div>

      <div class="field">

        <label for="valor">
          Valor
        </label>

        <input id="valor"
               name="valor"
               type="text"
               required
               th:value="${valorBusqueda}"
               placeholder="Ingrese DPI o número de orden">

      </div>

      <button type="submit"
              class="button button-primary">
        Buscar
      </button>

    </form>

  </section>

  <section class="card table-card"
           th:if="${ordenes != null}">

    <div class="table-header">

      <h3>
        Órdenes pendientes de pago
      </h3>

    </div>

    <div class="table-wrapper"
         th:if="${!#lists.isEmpty(ordenes)}">

      <table>

        <thead>
        <tr>
          <th>Orden</th>
          <th>Paciente</th>
          <th>DPI</th>
          <th>Exámenes</th>
          <th>Fecha</th>
          <th>Total</th>
          <th>Acción</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="orden : ${ordenes}">

          <td class="order"
              th:text="${orden.numeroOrden}">
          </td>

          <td class="patient"
              th:text="${orden.paciente}">
          </td>

          <td th:text="${orden.dpi}">
          </td>

          <td th:text="${orden.cantidadExamenes}">
          </td>

          <td th:text="${#temporals.format(
                            orden.fechaCreacion,
                            'dd/MM/yyyy HH:mm'
                    )}">
          </td>

          <td class="amount"
              th:text="'Q' + ${#numbers.formatDecimal(
                            orden.montoTotal,
                            1,
                            2
                    )}">
          </td>

          <td>

            <a th:href="@{
                            /caja/laboratorio/pagar/{id}
                            (id=${orden.id})
                        }"
               class="button button-pay">
              Cobrar
            </a>

          </td>

        </tr>

        </tbody>

      </table>

    </div>

    <div th:if="${#lists.isEmpty(ordenes)}"
         class="empty">
      No se encontraron órdenes pendientes.
    </div>

  </section>

</main>

</body>
</html>
