<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pago de Laboratorio</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --teal-dark: #0f6f7a;
            --teal: #1596a3;
            --teal-light: #e8f6f7;
            --background: #f4f8f9;
            --text: #203438;
            --muted: #71868a;
            --border: #dbe8ea;
            --danger-bg: #fff0ee;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .topbar {
            padding: 15px 34px;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: linear-gradient(
                    135deg,
                    var(--teal-dark),
                    var(--teal)
            );
        }

        .back {
            color: white;
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 9px;
            background: rgba(255,255,255,.14);
        }

        .container {
            width: min(850px, calc(100% - 38px));
            margin: 30px auto 60px;
        }

        .summary {
            margin-bottom: 20px;
            padding: 23px;

            border-radius: 18px;
            color: white;

            background: linear-gradient(
                    135deg,
                    var(--teal-dark),
                    var(--teal)
            );
        }

        .summary h2 {
            font-size: 22px;
        }

        .summary p {
            margin-top: 5px;
            opacity: .9;
        }

        .summary-grid {
            margin-top: 18px;

            display: grid;
            grid-template-columns:
                    repeat(3, minmax(0,1fr));
            gap: 12px;
        }

        .summary-item {
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,255,255,.12);
        }

        .summary-item span {
            display: block;
            font-size: 11px;
            opacity: .75;
            margin-bottom: 4px;
        }

        .summary-item strong {
            font-size: 13px;
        }

        .card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 17px;

            padding: 24px;

            box-shadow:
                    0 7px 23px rgba(35,73,79,.06);
        }

        .alert {
            margin-bottom: 18px;
            padding: 13px 16px;

            border-radius: 10px;

            color: #9d3025;
            background: var(--danger-bg);
            border: 1px solid #edc8c1;

            font-size: 13px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;

            font-size: 12px;
            font-weight: 700;
            color: #486266;
        }

        select,
        input {
            width: 100%;
            min-height: 42px;

            padding: 9px 11px;

            border: 1px solid #ccdadd;
            border-radius: 9px;

            font: inherit;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--teal);
            box-shadow:
                    0 0 0 3px rgba(21,150,163,.10);
        }

        .payment-section {
            margin-top: 18px;
        }

        .hidden {
            display: none;
        }

        .change-box {
            margin-top: 12px;
            padding: 13px;

            border-radius: 10px;

            background: var(--teal-light);

            color: var(--teal-dark);

            font-weight: 800;
        }

        .actions {
            margin-top: 22px;

            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .button {
            min-height: 42px;

            padding: 9px 17px;

            border: none;
            border-radius: 9px;

            text-decoration: none;
            cursor: pointer;

            font-family: inherit;
            font-weight: 700;
        }

        .button-secondary {
            background: #edf3f4;
            color: #465f63;
        }

        .button-primary {
            color: white;
            background: linear-gradient(
                    135deg,
                    var(--teal-dark),
                    var(--teal)
            );
        }

        @media (max-width: 650px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<header class="topbar">

    <div>
        <strong>💳 Pago de Laboratorio</strong>
    </div>

    <a th:href="@{/caja/laboratorio}"
       class="back">
        ← Volver
    </a>

</header>

<main class="container">

    <section class="summary">

        <h2 th:text="${orden.numeroOrden}">
            LAB-000
        </h2>

        <p th:text="${orden.paciente}">
            Paciente
        </p>

        <div class="summary-grid">

            <div class="summary-item">

                <span>DPI</span>

                <strong th:text="${orden.dpi}">
                </strong>

            </div>

            <div class="summary-item">

                <span>Exámenes</span>

                <strong th:text="${orden.cantidadExamenes}">
                </strong>

            </div>

            <div class="summary-item">

                <span>Total a pagar</span>

                <strong th:text="'Q' + ${#numbers.formatDecimal(
                        orden.montoTotal,
                        1,
                        2
                )}">
                </strong>

            </div>

        </div>

    </section>

    <div th:if="${error}"
         class="alert"
         th:text="${error}">
    </div>

    <section class="card">

        <form th:action="@{/caja/laboratorio/procesar}"
              th:object="${pagoForm}"
              method="post">

            <input type="hidden"
                   th:field="*{ordenId}">

            <div class="field">

                <label for="metodoPago">
                    Método de pago *
                </label>

                <select id="metodoPago"
                        th:field="*{metodoPago}"
                        required>

                    <option value="">
                        Seleccione
                    </option>

                    <option value="EFECTIVO">
                        Efectivo
                    </option>

                    <option value="VISA">
                        Visa
                    </option>

                    <option value="MASTERCARD">
                        Mastercard
                    </option>

                    <option value="DEBITO">
                        Débito
                    </option>

                </select>

            </div>

            <div id="efectivoSection"
                 class="payment-section hidden">

                <div class="field">

                    <label for="montoRecibido">
                        Monto recibido
                    </label>

                    <input id="montoRecibido"
                           type="number"
                           min="0"
                           step="0.01"
                           th:field="*{montoRecibido}">

                </div>

                <div class="change-box">

                    Cambio:
                    <span id="cambio">
                        Q0.00
                    </span>

                </div>

            </div>

            <div id="tarjetaSection"
                 class="payment-section hidden">

                <div class="field">

                    <label for="ultimos4">
                        Últimos 4 dígitos
                    </label>

                    <input id="ultimos4"
                           type="text"
                           maxlength="4"
                           inputmode="numeric"
                           pattern="[0-9]{4}"
                           th:field="*{ultimos4}"
                           placeholder="1234">

                </div>

                <small style="color:#71868a;">
                    Para simular rechazo use 0000.
                </small>

            </div>

            <div class="actions">

                <a th:href="@{/caja/laboratorio}"
                   class="button button-secondary">
                    Cancelar
                </a>

                <button type="submit"
                        class="button button-primary"
                        onclick="return confirm(
                            '¿Confirmar el pago de esta orden?'
                        );">
                    Confirmar Pago
                </button>

            </div>

        </form>

    </section>

</main>

<script th:inline="javascript">

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const total =
                Number(
                    /*[[${orden.montoTotal}]]*/ 0
                );

            const metodo =
                document.getElementById(
                    "metodoPago"
                );

            const efectivo =
                document.getElementById(
                    "efectivoSection"
                );

            const tarjeta =
                document.getElementById(
                    "tarjetaSection"
                );

            const monto =
                document.getElementById(
                    "montoRecibido"
                );

            const ultimos4 =
                document.getElementById(
                    "ultimos4"
                );

            const cambio =
                document.getElementById(
                    "cambio"
                );


            function actualizarMetodo() {

                const valor =
                    metodo.value;

                efectivo.classList.add(
                    "hidden"
                );

                tarjeta.classList.add(
                    "hidden"
                );

                monto.required = false;
                ultimos4.required = false;


                if (valor === "EFECTIVO") {

                    efectivo.classList.remove(
                        "hidden"
                    );

                    monto.required = true;

                } else if (
                    valor === "VISA"
                    || valor === "MASTERCARD"
                    || valor === "DEBITO"
                ) {

                    tarjeta.classList.remove(
                        "hidden"
                    );

                    ultimos4.required = true;
                }
            }


            function actualizarCambio() {

                const recibido =
                    Number(
                        monto.value
                    ) || 0;

                const diferencia =
                    recibido - total;

                cambio.textContent =
                    "Q"
                    + Math.max(
                        diferencia,
                        0
                    ).toFixed(2);
            }


            metodo.addEventListener(
                "change",
                actualizarMetodo
            );

            monto.addEventListener(
                "input",
                actualizarCambio
            );


            actualizarMetodo();
            actualizarCambio();
        }
    );

</script>

</body>
</html>
