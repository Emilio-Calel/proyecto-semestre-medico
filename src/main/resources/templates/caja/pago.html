<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pago presencial</title>
</head>

<body>

<h1>Pago Presencial</h1>

<div th:if="${error}">
    <strong th:text="${error}"></strong>
</div>

<p>
    Cita:
    <strong th:text="${cita.numeroCita}"></strong>
</p>

<p>
    Paciente:
    <strong th:text="${cita.paciente.nombreCompleto}"></strong>
</p>

<p>
    Total:
    Q<strong th:text="${monto}"></strong>
</p>

<hr>

<form
        th:action="@{/caja/procesar}"
        th:object="${pagoForm}"
        method="post">

    <input
            type="hidden"
            th:field="*{citaId}">

    <label for="metodoPago">
        Método de pago
    </label>

    <select
            id="metodoPago"
            th:field="*{metodoPago}"
            onchange="actualizarCampos()"
            required>

        <option value="">
            Seleccione
        </option>

        <option value="EFECTIVO">
            Efectivo
        </option>

        <option value="VISA">
            Visa
        </option>

        <option value="MASTERCARD">
            Mastercard
        </option>

        <option value="DEBITO">
            Débito
        </option>

    </select>

    <div
            id="datosTarjeta"
            style="display:none;">

        <br>

        <label for="numeroTarjeta">
            Número de tarjeta
        </label>

        <input
                type="text"
                id="numeroTarjeta"
                th:field="*{numeroTarjeta}"
                maxlength="19">

        <br><br>

        <label for="nombreTitular">
            Titular
        </label>

        <input
                type="text"
                id="nombreTitular"
                th:field="*{nombreTitular}">

        <br><br>

        <label for="expiracion">
            Expiración
        </label>

        <input
                type="text"
                id="expiracion"
                th:field="*{expiracion}"
                placeholder="MM/YY"
                maxlength="5">

        <br><br>

        <label for="cvv">
            CVV
        </label>

        <input
                type="password"
                id="cvv"
                th:field="*{cvv}"
                maxlength="4">

    </div>

    <br><br>

    <button type="submit">
        Registrar pago
    </button>

</form>

<script>

    function actualizarCampos() {

        const metodo =
            document.getElementById(
                "metodoPago"
            ).value;

        const tarjeta =
            document.getElementById(
                "datosTarjeta"
            );

        tarjeta.style.display =
            metodo === "EFECTIVO"
            || metodo === ""
                ? "none"
                : "block";
    }

</script>

</body>
</html>
