<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Comprobante</title>
</head>

<body>

<h1>Pago Registrado</h1>

<p>
    Número de transacción:
    <strong th:text="${pago.numeroTransaccion}"></strong>
</p>

<p>
    Número de cita:
    <strong th:text="${cita.numeroCita}"></strong>
</p>

<p>
    Paciente:
    <strong th:text="${cita.paciente.nombreCompleto}"></strong>
</p>

<p>
    Monto:
    Q<strong th:text="${pago.monto}"></strong>
</p>

<p>
    Método:
    <strong th:text="${pago.metodoPago}"></strong>
</p>

<p>
    Canal:
    <strong th:text="${pago.canal}"></strong>
</p>

<p th:if="${pago.ultimos4 != null}">
    Tarjeta:
    ****
    <strong th:text="${pago.ultimos4}"></strong>
</p>

<p>
    Fecha:
    <strong th:text="${pago.fechaPago}"></strong>
</p>

<p>
    Sucursal:
    <strong th:text="${cita.sucursal.nombre}"></strong>
</p>

<button onclick="window.print()">
    Imprimir comprobante
</button>

<p>
    <a th:href="@{/caja}">
        Volver a Caja
    </a>
</p>

</body>
</html>
