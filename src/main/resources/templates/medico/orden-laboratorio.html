<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Orden de Laboratorio | Sistema Hospitalario</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --teal-dark: #0f6f7a;
            --teal: #1596a3;
            --teal-light: #e8f6f7;
            --background: #f4f8f9;
            --white: #ffffff;
            --text: #203438;
            --muted: #71868a;
            --border: #dbe8ea;

            --danger: #c0392b;
            --danger-bg: #fff0ee;

            --success: #198754;
            --warning: #b7791f;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        .topbar {
            min-height: 74px;
            padding: 14px 34px;
            background: linear-gradient(
                    135deg,
                    var(--teal-dark),
                    var(--teal)
            );
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 5px 18px rgba(15,111,122,.16);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 13px;
            background: rgba(255,255,255,.16);
            display: grid;
            place-items: center;
            font-size: 23px;
        }

        .brand h1 {
            font-size: 20px;
        }

        .brand p {
            font-size: 13px;
            opacity: .84;
            margin-top: 2px;
        }

        .back-button {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,.14);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .container {
            width: min(1100px, calc(100% - 36px));
            margin: 30px auto 60px;
        }

        .summary {
            background: linear-gradient(
                    135deg,
                    var(--teal-dark),
                    var(--teal)
            );
            border-radius: 18px;
            color: white;
            padding: 22px 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(15,111,122,.16);
        }

        .summary h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .summary-grid {
            margin-top: 15px;
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
            font-size: 13px;
            opacity: .92;
        }

        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 7px 22px rgba(35,73,79,.06);
            overflow: hidden;
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-header h3 {
            color: var(--teal-dark);
            font-size: 19px;
            margin-bottom: 5px;
        }

        .card-header p {
            color: var(--muted);
            font-size: 13px;
        }

        .card-body {
            padding: 24px;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 11px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid #efc5bf;
            color: #9c3025;
        }

        .section-title {
            color: #3c575b;
            font-size: 15px;
            margin-bottom: 13px;
        }

        .exam-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .exam-card {
            display: block;
            cursor: pointer;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: #fbfdfd;
            transition: .2s;
            overflow: hidden;
        }

        .exam-card:hover {
            border-color: #a7cfd4;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(35,73,79,.06);
        }

        .exam-content {
            padding: 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .exam-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: var(--teal);
            flex-shrink: 0;
        }

        .exam-info {
            flex: 1;
        }

        .exam-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }

        .exam-name {
            font-size: 14px;
            font-weight: 700;
            color: #334e52;
        }

        .price {
            white-space: nowrap;
            color: var(--teal-dark);
            font-size: 14px;
            font-weight: 800;
        }

        .exam-code {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--teal);
        }

        .exam-description {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .exam-range {
            margin-top: 6px;
            color: #819397;
            font-size: 11px;
        }

        .options {
            margin-top: 26px;
            display: grid;
            gap: 18px;
        }

        .external-option {
            background: #fff9e9;
            border: 1px solid #f0dfaa;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: flex-start;
            gap: 11px;
        }

        .external-option input {
            width: 18px;
            height: 18px;
            accent-color: var(--teal);
            margin-top: 1px;
        }

        .external-option strong {
            display: block;
            font-size: 14px;
            color: #705a1f;
            margin-bottom: 4px;
        }

        .external-option span {
            color: #897843;
            font-size: 12px;
        }

        label.field-label {
            display: block;
            margin-bottom: 7px;
            color: #415b5f;
            font-size: 13px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 115px;
            resize: vertical;
            border: 1px solid #ccdadd;
            border-radius: 10px;
            padding: 11px 13px;
            font: inherit;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--teal);
            box-shadow:
                    0 0 0 3px rgba(21,150,163,.10);
        }

        .total-box {
            margin-top: 24px;
            padding: 17px;
            background: var(--teal-light);
            border-radius: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .total-box span {
            color: var(--teal-dark);
            font-size: 14px;
            font-weight: 700;
        }

        .total-value {
            font-size: 22px !important;
            font-weight: 800 !important;
        }

        .footer-actions {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .button {
            min-height: 43px;
            border-radius: 10px;
            padding: 10px 18px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .button-secondary {
            background: #edf3f4;
            color: #435d61;
        }

        .button-primary {
            background: linear-gradient(
                    135deg,
                    var(--teal-dark),
                    var(--teal)
            );
            color: white;
        }

        @media (max-width: 760px) {

            .exam-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 14px 18px;
            }

            .footer-actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🧪
        </div>

        <div>
            <h1>Orden de Laboratorio</h1>
            <p>Nueva solicitud de exámenes</p>
        </div>

    </div>

    <a th:href="@{/medico}"
       class="back-button">
        ← Volver
    </a>

</header>

<main class="container">

    <section class="summary">

        <h2 th:text="${consulta.paciente}">
            Paciente
        </h2>

        <div class="summary-grid">

            <span th:text="'Cita #' + ${consulta.numeroCita}">
                Cita #000
            </span>

            <span>
                Consulta médica finalizada
            </span>

        </div>

    </section>

    <section class="card">

        <div class="card-header">

            <h3>Seleccione los exámenes</h3>

            <p>
                Puede seleccionar uno o varios exámenes
                para la misma orden.
            </p>

        </div>

        <div class="card-body">

            <div th:if="${error}"
                 class="alert alert-error"
                 th:text="${error}">
            </div>

            <form th:action="@{/medico/orden-laboratorio/guardar}"
                  th:object="${ordenForm}"
                  method="post">

                <input type="hidden"
                       th:field="*{citaId}">

                <h4 class="section-title">
                    Catálogo de exámenes disponibles
                </h4>

                <div class="exam-grid">

                    <label class="exam-card"
                           th:each="examen : ${examenes}">

                        <div class="exam-content">

                            <input type="checkbox"
                                   name="examenesIds"
                                   th:value="${examen.id}"
                                   th:attr="data-precio=${examen.precio}"
                                   class="exam-checkbox">

                            <div class="exam-info">

                                <div class="exam-top">

                                    <span class="exam-name"
                                          th:text="${examen.nombre}">
                                    </span>

                                    <span class="price"
                                          th:text="'Q' + ${#numbers.formatDecimal(
                                              examen.precio,
                                              1,
                                              2
                                          )}">
                                    </span>

                                </div>

                                <div class="exam-code"
                                     th:text="${examen.codigo}">
                                </div>

                                <div class="exam-description"
                                     th:if="${examen.descripcion != null}"
                                     th:text="${examen.descripcion}">
                                </div>

                                <div class="exam-range"
                                     th:if="${examen.rangoReferencia != null}"
                                     th:text="'Referencia: ' + ${examen.rangoReferencia}">
                                </div>

                            </div>

                        </div>

                    </label>

                </div>

                <div class="options">

                    <label class="external-option">

                        <input type="checkbox"
                               th:field="*{externa}">

                        <div>

                            <strong>
                                Orden Externa
                            </strong>

                            <span>
                                Marque esta opción si el paciente
                                realizará los exámenes en un
                                laboratorio externo.
                            </span>

                        </div>

                    </label>

                    <div>

                        <label class="field-label"
                               for="notas">
                            Observaciones
                        </label>

                        <textarea id="notas"
                                  th:field="*{notas}"
                                  maxlength="2000"
                                  placeholder="Indicaciones u observaciones para laboratorio...">
                        </textarea>

                    </div>

                </div>

                <div class="total-box">

                    <span>
                        Monto estimado de la orden
                    </span>

                    <span id="total"
                          class="total-value">
                        Q0.00
                    </span>

                </div>

                <div class="footer-actions">

                    <a th:href="@{/medico}"
                       class="button button-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="button button-primary">
                        Guardar orden
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>

<script>

    const checkboxes =
        document.querySelectorAll(
            ".exam-checkbox"
        );

    const totalElemento =
        document.getElementById(
            "total"
        );

    function actualizarTotal() {

        let total = 0;

        checkboxes.forEach(
            checkbox => {

                if (checkbox.checked) {

                    total +=
                        Number(
                            checkbox.dataset.precio
                        ) || 0;
                }
            }
        );

        totalElemento.textContent =
            "Q" + total.toFixed(2);
    }

    checkboxes.forEach(
        checkbox => {

            checkbox.addEventListener(
                "change",
                actualizarTotal
            );
        }
    );

    actualizarTotal();

</script>

</body>
</html>
