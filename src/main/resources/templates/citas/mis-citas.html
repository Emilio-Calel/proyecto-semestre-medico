<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mis Citas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f9;
            color: #1f2933;
            min-height: 100vh;
        }

        .topbar {
            min-height: 74px;
            padding: 0 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background:
                    linear-gradient(
                            135deg,
                            #0f6f7a,
                            #1596a3
                    );
            color: #ffffff;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background:
                    rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .brand h1 {
            font-size: 20px;
        }

        .back-link {
            color: #ffffff;
            text-decoration: none;
            border:
                    1px solid
                    rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 42px 24px;
        }

        .header {
            margin-bottom: 26px;
        }

        .header h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #718087;
        }

        .empty {
            background: #ffffff;
            border: 1px solid #e2ebed;
            border-radius: 16px;
            padding: 45px;
            text-align: center;
            color: #718087;
        }

        .appointments {
            display: grid;
            gap: 18px;
        }

        .appointment {
            background: #ffffff;
            border: 1px solid #e2ebed;
            border-radius: 16px;
            padding: 24px;
            box-shadow:
                    0 6px 18px
                    rgba(30,70,80,0.06);
        }

        .appointment-top {
            display: flex;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 18px;
        }

        .appointment-number {
            color: #0f6f7a;
            font-weight: bold;
        }

        .status {
            background: #e8f6f7;
            color: #0f6f7a;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 15px 25px;
        }

        .detail {
            display: grid;
            gap: 4px;
        }

        .detail span {
            color: #849197;
            font-size: 12px;
        }

        .detail strong {
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #98a4a8;
            font-size: 12px;
            padding: 28px;
        }

        @media (max-width: 650px) {
            .topbar {
                padding: 14px 18px;
            }

            .container {
                padding: 30px 14px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .appointment-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            📅
        </div>

        <h1>
            Mis Citas
        </h1>

    </div>

    <a
            class="back-link"
            th:href="@{/dashboard}">
        Volver al panel
    </a>

</header>

<main class="container">

    <section class="header">

        <h2>Mis Citas</h2>

        <p>
            Consulte las citas asociadas a su cuenta.
        </p>

    </section>

    <div
            class="empty"
            th:if="${#lists.isEmpty(citas)}">

        No tiene citas registradas.

    </div>

    <section
            class="appointments"
            th:if="${!#lists.isEmpty(citas)}">

        <article
                class="appointment"
                th:each="cita : ${citas}">

            <div class="appointment-top">

                <span
                        class="appointment-number"
                        th:text="${cita.numeroCita}">
                </span>

                <span
                        class="status"
                        th:text="${cita.estadoCita.nombre}">
                </span>

            </div>

            <div class="details">

                <div class="detail">
                    <span>Médico</span>
                    <strong
                            th:text="${cita.medico.personal.nombreCompleto}">
                    </strong>
                </div>

                <div class="detail">
                    <span>Especialidad</span>
                    <strong
                            th:text="${cita.especialidad.nombre}">
                    </strong>
                </div>

                <div class="detail">
                    <span>Sucursal</span>
                    <strong
                            th:text="${cita.sucursal.nombre}">
                    </strong>
                </div>

                <div class="detail">
                    <span>Fecha y hora</span>
                    <strong
                            th:text="${cita.fechaHoraInicio}">
                    </strong>
                </div>

            </div>

        </article>

    </section>

</main>

<footer class="footer">
    Sistema Informático Hospitalario
</footer>

</body>
</html>
