<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Especialidades</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f9;
            color: #1f2933;
            min-height: 100vh;
        }

        .topbar {
            background: linear-gradient(
                    135deg,
                    #0f6f7a,
                    #1596a3
            );
            color: white;
            padding: 22px 34px;
        }

        .topbar h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .topbar p {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border: 1px solid #e2ebed;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(30,70,80,0.07);
        }

        .btn {
            border: none;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: #0f6f7a;
            color: white;
        }

        .btn-secondary {
            background: #e8eef0;
            color: #405057;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        .btn-success {
            background: #2e8b57;
            color: white;
        }

        .success,
        .error {
            padding: 13px 15px;
            border-radius: 9px;
            margin-bottom: 15px;
        }

        .success {
            background: #e8f7ef;
            color: #237a4b;
            border: 1px solid #b9e7ce;
        }

        .error {
            background: #fff0ef;
            color: #a33b31;
            border: 1px solid #efc4c0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 11px;
            text-align: left;
            border-bottom: 1px solid #edf2f3;
        }

        th {
            background: #f6fafb;
            color: #526167;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .active {
            background: #e6f7ed;
            color: #237a4b;
        }

        .inactive {
            background: #fdeceb;
            color: #a33b31;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .actions form {
            margin: 0;
        }

        .empty {
            text-align: center;
            color: #7b898e;
            padding: 35px;
        }

        .back {
            margin-top: 22px;
        }
    </style>
</head>

<body>

<header class="topbar">

    <h1>Catálogo de Especialidades</h1>

    <p>
        Administración de especialidades médicas.
    </p>

</header>

<main class="container">

    <div class="toolbar">

        <h2>Especialidades registradas</h2>

        <a sec:authorize="hasAuthority('CATALOG_CREATE')" class="btn btn-primary"
           th:href="@{/admin/especialidades/nueva}">
            Crear
        </a>

    </div>

    <div
            class="success"
            th:if="${mensaje}"
            th:text="${mensaje}">
    </div>

    <div
            class="error"
            th:if="${error}"
            th:text="${error}">
    </div>

    <section class="card">

        <div th:replace="~{admin/fragmentos-catalogo :: filtro}"></div>
        <table th:if="${!#lists.isEmpty(especialidades)}">

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="especialidad : ${especialidades}">

                <td th:text="${especialidad.id}">
                </td>

                <td th:text="${especialidad.nombre}">
                </td>

                <td th:text="${especialidad.descripcion}">
                </td>

                <td>

                    <span
                            th:if="${especialidad.activo}"
                            class="badge active">
                        Activa
                    </span>

                    <span
                            th:unless="${especialidad.activo}"
                            class="badge inactive">
                        Inactiva
                    </span>

                </td>

                <td>

                    <div class="actions">

                        <a sec:authorize="hasAuthority('CATALOG_UPDATE')"
                                class="btn btn-secondary"
                                th:href="@{
                                    /admin/especialidades/editar/{id}
                                    (id=${especialidad.id})
                                }">
                            Editar
                        </a>

                        <form sec:authorize="hasAuthority('CATALOG_DISABLE')"
                                th:if="${especialidad.activo}"
                                th:action="@{
                                    /admin/especialidades/desactivar/{id}
                                    (id=${especialidad.id})
                                }"
                                method="post"
                                th:attr="data-nombre=${especialidad.nombre}"
                                onsubmit="return confirm('¿Está seguro que desea eliminar el registro ' + this.dataset.nombre + '? Esta acción no se puede deshacer.');">

                            <button
                                    type="submit"
                                    class="btn btn-danger">Eliminar</button>

                        </form>

                        <form sec:authorize="hasAuthority('CATALOG_UPDATE')"
                                th:unless="${especialidad.activo}"
                                th:action="@{
                                    /admin/especialidades/reactivar/{id}
                                    (id=${especialidad.id})
                                }"
                                method="post">

                            <button
                                    type="submit"
                                    class="btn btn-success">
                                Reactivar
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>
        <div th:replace="~{admin/fragmentos-catalogo :: paginacion}"></div>

        <div
                class="empty"
                th:if="${#lists.isEmpty(especialidades)}">
            No se encontraron resultados.
        </div>

    </section>

    <div class="back">

        <a
                class="btn btn-secondary"
                th:href="@{/admin/catalogos}">
            ← Volver a catálogos
        </a>

    </div>

</main>

</body>
</html>
