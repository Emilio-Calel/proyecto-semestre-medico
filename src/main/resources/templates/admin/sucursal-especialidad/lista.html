<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Especialidades por Sede</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f9;
            color: #1f2933;
            min-height: 100vh;
        }

        .topbar {
            background: linear-gradient(
                    135deg,
                    #0f6f7a,
                    #1596a3
            );
            color: white;
            padding: 22px 34px;
            box-shadow: 0 3px 12px rgba(15, 80, 90, 0.15);
        }

        .topbar h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .topbar p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .toolbar h2 {
            font-size: 22px;
        }

        .btn {
            border: none;
            text-decoration: none;
            padding: 11px 16px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background: #0f6f7a;
            color: white;
        }

        .btn-primary:hover {
            background: #0b5962;
        }

        .btn-danger {
            background: #c0392b;
            color: white;
        }

        .btn-danger:hover {
            background: #992d22;
        }

        .btn-secondary {
            background: #e8eef0;
            color: #405057;
        }

        .messages {
            margin-bottom: 20px;
        }

        .success {
            background: #e8f7ef;
            color: #237a4b;
            border: 1px solid #b9e7ce;
            padding: 13px 15px;
            border-radius: 9px;
            margin-bottom: 10px;
        }

        .error {
            background: #fff0ef;
            color: #a33b31;
            border: 1px solid #efc4c0;
            padding: 13px 15px;
            border-radius: 9px;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(30, 70, 80, 0.07);
            border: 1px solid #e2ebed;
            margin-bottom: 24px;
        }

        .filter-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 13px;
            font-weight: bold;
            color: #506067;
        }

        .field input {
            min-width: 220px;
            padding: 11px 12px;
            border: 1px solid #ccd9dc;
            border-radius: 8px;
            font-size: 14px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f3;
        }

        th {
            background: #f6fafb;
            color: #53646a;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-active {
            background: #e6f7ed;
            color: #237a4b;
        }

        .badge-inactive {
            background: #fdeceb;
            color: #a33b31;
        }

        .empty {
            text-align: center;
            color: #7b898e;
            padding: 34px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .footer-actions {
            margin-top: 24px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 24px 14px;
            }

            .topbar {
                padding: 20px 18px;
            }

            .toolbar {
                align-items: stretch;
            }

            .toolbar .btn {
                width: 100%;
                text-align: center;
            }

            .filter-form {
                flex-direction: column;
                align-items: stretch;
            }

            .field input {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>Especialidades por Sede</h1>
    <p>
        Administre las especialidades disponibles en cada sucursal.
    </p>
</header>

<main class="container">

    <div class="toolbar">

        <h2>Asignaciones registradas</h2>

        <a class="btn btn-primary"
           th:href="@{/admin/sucursal-especialidad/nueva}"
           sec:authorize="hasAuthority('CATALOG_CREATE')">
            + Asignar Especialidad
        </a>

    </div>

    <div class="messages">

        <div class="success"
             th:if="${mensaje}"
             th:text="${mensaje}">
        </div>

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>

    </div>

    <section class="card">

        <form class="filter-form"
              method="get"
              th:action="@{/admin/sucursal-especialidad}">

            <div class="field">
                <label for="id">
                    Filtrar por ID
                </label>

                <input
                        id="id"
                        type="number"
                        min="1"
                        name="id"
                        th:value="${idFiltro}"
                        placeholder="Ej. 5">
            </div>

            <button
                    type="submit"
                    class="btn btn-primary">
                Buscar
            </button>

            <a class="btn btn-secondary"
               th:href="@{/admin/sucursal-especialidad}">
                Limpiar
            </a>

        </form>

    </section>

    <section class="card">

        <div class="table-wrapper">

            <table th:if="${!#lists.isEmpty(asignaciones)}">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Sede</th>
                    <th>Especialidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="asignacion : ${asignaciones}">

                    <td th:text="${asignacion.id}">
                    </td>

                    <td th:text="${asignacion.sucursal.nombre}">
                    </td>

                    <td th:text="${asignacion.especialidad.nombre}">
                    </td>

                    <td>

                        <span
                                class="badge badge-active"
                                th:if="${asignacion.activo}">
                            Activo
                        </span>

                        <span
                                class="badge badge-inactive"
                                th:unless="${asignacion.activo}">
                            Inactivo
                        </span>

                    </td>

                    <td>

                        <div class="actions">

                            <form
                                    th:if="${asignacion.activo}"
                                    sec:authorize="hasAuthority('CATALOG_DISABLE')"
                                    th:action="@{
                                        /admin/sucursal-especialidad/desactivar/{id}
                                        (id=${asignacion.id})
                                    }"
                                    method="post"
                                    onsubmit="return confirm(
                                        '¿Confirmar eliminación?'
                                    );">

                                <button
                                        type="submit"
                                        class="btn btn-danger">
                                    Eliminar
                                </button>

                            </form>

                            <span
                                    th:unless="${asignacion.activo}"
                                    style="color:#7b898e;font-size:13px;">
                                Sin acciones
                            </span>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="empty"
                 th:if="${#lists.isEmpty(asignaciones)}">

                No se encontraron resultados.

            </div>

        </div>

    </section>

    <nav th:if="${totalPaginas > 0}" aria-label="Paginación de asignaciones">
        <a class="btn btn-secondary" th:if="${paginaActual > 0}"
           th:href="@{/admin/sucursal-especialidad(page=${paginaActual - 1},id=${idFiltro})}">Anterior</a>
        <span th:text="|Página ${paginaActual + 1} de ${totalPaginas} · ${totalElementos} asignaciones|"></span>
        <a class="btn btn-secondary" th:if="${paginaActual + 1 < totalPaginas}"
           th:href="@{/admin/sucursal-especialidad(page=${paginaActual + 1},id=${idFiltro})}">Siguiente</a>
    </nav>

    <div class="footer-actions">

        <a class="btn btn-secondary"
           th:href="@{/dashboard}">
            ← Volver al panel principal
        </a>

    </div>

</main>

</body>
</html>
