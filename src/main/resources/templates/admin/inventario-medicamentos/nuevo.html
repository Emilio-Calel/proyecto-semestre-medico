<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo Inventario</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f9;
            color: #1f2933;
            min-height: 100vh;
        }

        .topbar {
            background: linear-gradient(
                    135deg,
                    #0f6f7a,
                    #1596a3
            );
            color: white;
            padding: 22px 34px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 22px;
        }

        .card {
            background: white;
            border: 1px solid #e2ebed;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(30,70,80,0.07);
        }

        .card h2 {
            margin-bottom: 8px;
        }

        .description {
            color: #728187;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
            color: #506067;
        }

        select,
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccd9dc;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .error {
            background: #fff0ef;
            color: #a33b31;
            border: 1px solid #efc4c0;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        .info {
            background: #edf8f9;
            border: 1px solid #c8e8eb;
            color: #34676d;
            border-radius: 9px;
            padding: 13px 15px;
            font-size: 13px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 27px;
        }

        .btn {
            text-decoration: none;
            border: none;
            padding: 11px 17px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #0f6f7a;
            color: white;
        }

        .btn-secondary {
            background: #e8eef0;
            color: #405057;
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>Nuevo Inventario</h1>
</header>

<main class="container">

    <section class="card">

        <h2>Inventario inicial</h2>

        <p class="description">
            Registre el stock inicial de un medicamento
            para una sucursal.
        </p>

        <div
                class="error"
                th:if="${error}"
                th:text="${error}">
        </div>

        <form
                th:action="@{/admin/inventario-medicamentos/guardar}"
                method="post">

            <div class="field">

                <label for="medicamentoId">
                    Medicamento *
                </label>

                <select
                        id="medicamentoId"
                        name="medicamentoId"
                        required>

                    <option value="">
                        Seleccione un medicamento
                    </option>

                    <option
                            th:each="medicamento : ${medicamentos}"
                            th:value="${medicamento.id}"
                            th:text="${medicamento.nombre}"
                            th:selected="${medicamentoSeleccionado != null
                                and medicamentoSeleccionado == medicamento.id}">
                    </option>

                </select>

            </div>

            <div class="field">

                <label for="sucursalId">
                    Sucursal *
                </label>

                <select
                        id="sucursalId"
                        name="sucursalId"
                        required>

                    <option value="">
                        Seleccione una sucursal
                    </option>

                    <option
                            th:each="sucursal : ${sucursales}"
                            th:value="${sucursal.id}"
                            th:text="${sucursal.nombre}"
                            th:selected="${sucursalSeleccionada != null
                                and sucursalSeleccionada == sucursal.id}">
                    </option>

                </select>

            </div>

            <div class="field">

                <label for="stockActual">
                    Stock inicial *
                </label>

                <input
                        id="stockActual"
                        name="stockActual"
                        type="number"
                        min="0"
                        step="1"
                        required
                        th:value="${stockIngresado}">

            </div>

            <div class="info">
                Después de registrar el inventario inicial,
                las entradas y salidas de stock se realizarán
                mediante la Bitácora de Movimientos del CU-15.
            </div>

            <div class="actions">

                <a
                        class="btn btn-secondary"
                        th:href="@{/admin/inventario-medicamentos}">
                    Cancelar
                </a>

                <button
                        type="submit"
                        class="btn btn-primary">
                    Registrar inventario
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
