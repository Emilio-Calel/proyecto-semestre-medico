spring.application.name=proyecto-semestre-medico

spring.datasource.url=jdbc:postgresql://localhost:5432/proyecto_medico
spring.datasource.username=postgres
spring.datasource.password=123

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

app.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}

app.bootstrap-admin.nombre=${APP_ADMIN_NAME:Administrador General}
app.bootstrap-admin.sucursal=${APP_ADMIN_BRANCH:Hospital Central}
app.crypto.secret=${APP_CRYPTO_SECRET:}
app.citas.duracion-minutos=30
app.citas.reserva-minutos=10
app.citas.expiracion-check-ms=60000
app.archivos.directorio=uploads/citas
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.citas.precio-base=250.00
app.correo.check-ms=60000

# ==========================================
# CORREO SMTP
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}

# ==========================================
# DATOS INSTITUCIONALES
# ==========================================

app.hospital.nombre=${HOSPITAL_NAME:Hospital}
app.hospital.telefono=${HOSPITAL_PHONE:}